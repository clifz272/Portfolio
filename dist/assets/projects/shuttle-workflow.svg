<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title"><title id="title">From passenger input to a schedule</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#a9befa"/></marker></defs><rect width="900" height="600" fill="#0b1020"/><g font-family="Manrope,Arial,sans-serif"><text x="60" y="68" fill="#a9befa" font-size="32" font-weight="600">From passenger input to a schedule</text><g><rect x="60" y="140" width="330" height="130" rx="16" fill="#192640" stroke="#899fde" stroke-width="2"/><text x="225" y="218" text-anchor="middle" fill="#e7ecf5" font-size="38" font-weight="600"><tspan x="225" dy="0">Validate inputs</tspan></text></g><g><rect x="510" y="140" width="330" height="130" rx="16" fill="#192640" stroke="#899fde" stroke-width="2"/><text x="675" y="197" text-anchor="middle" fill="#e7ecf5" font-size="38" font-weight="600"><tspan x="675" dy="0">Scheduling</tspan><tspan x="675" dy="47">strategy</tspan></text></g><g><rect x="510" y="390" width="330" height="130" rx="16" fill="#192640" stroke="#899fde" stroke-width="2"/><text x="675" y="468" text-anchor="middle" fill="#e7ecf5" font-size="38" font-weight="600"><tspan x="675" dy="0">Assign shuttles</tspan></text></g><g><rect x="60" y="390" width="330" height="130" rx="16" fill="#192640" stroke="#899fde" stroke-width="2"/><text x="225" y="468" text-anchor="middle" fill="#e7ecf5" font-size="38" font-weight="600"><tspan x="225" dy="0">Save schedules</tspan></text></g><path d="M395 205H500" fill="none" stroke="#a9befa" stroke-width="3" marker-end="url(#arrow)"/><path d="M675 280V380" fill="none" stroke="#a9befa" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 455H400" fill="none" stroke="#a9befa" stroke-width="3" marker-end="url(#arrow)"/></g></svg>
